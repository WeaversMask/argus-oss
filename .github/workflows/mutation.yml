# Weekly mutation testing (OPS-04, argus-oss#15 item 3): Stryker over
# packages/*/src with the vitest runner. 100% line/branch coverage measures
# execution, not assertion quality — mutation score checks that the tests
# actually assert.
#
# WEEKLY, not per-PR (cost: mutates every statement and re-runs the suite per
# mutant). REPORT-ONLY while the baseline settles: stryker.config.mjs has
# `thresholds.break: null`, so this workflow fails only on operational errors,
# never on the score. Once the tracker's Metrics Snapshot carries a stable
# baseline, set `break` just below it to make regressions fail the run.
#
# Runs Tuesdays 12:00 UTC — deliberately NOT Monday alongside ci.yml's weekly
# cron, so one bad infra day doesn't take out both canaries. Also dispatchable
# by hand for on-demand runs (e.g. after a big test refactor).
#
# Every action SHA-pinned per P0-13/ADR-0003; Dependabot keeps pins fresh.

name: Mutation testing

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml + the engines.node floor in package.json.
  NODE_VERSION: "22.23.1"
  ARGUS_SKIP_GITLEAKS_INSTALL: "1"
  HUSKY: "0"

jobs:
  mutation:
    name: Mutation score (Stryker, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker (report-only)
        run: pnpm mutation

      # The HTML report is the artifact of record; the JSON feeds any future
      # trend tooling. Uploaded even when Stryker exits non-zero so an
      # operational failure still leaves evidence behind.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 90
