# Argus release pipeline (P0-09): Changesets drives versioning + publishing.
# Flow: contributors add changesets (`pnpm changeset`); on push to main this
# workflow either (a) opens/updates the "Version Packages" PR while changesets
# are pending, or (b) publishes to the public npm registry after that PR
# merges (maintainer decision 2026-07-05: registry.npmjs.org).
#
# Today every workspace package is private:true, so the publish step is a
# structural no-op. The first real publish needs (1) a package with `private`
# removed and (2) an NPM_TOKEN repo secret — admin step, same pending bucket
# as P0-03. An empty NODE_AUTH_TOKEN until then is harmless.
#
# Every action SHA-pinned per P0-13/ADR-0003; Dependabot keeps pins fresh.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml + the engines.node floor in package.json.
  NODE_VERSION: "22.23.1"
  ARGUS_SKIP_GITLEAKS_INSTALL: "1"
  HUSKY: "0"

jobs:
  release:
    name: Version PR or publish (changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The changesets action pushes the changeset-release/main branch and
    # opens/updates the Version Packages PR — main itself stays protected
    # and only changes via merged PRs.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Changelog generation walks commit history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open Version PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
