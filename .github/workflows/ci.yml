# Argus CI — lint, format, typecheck, test, build, commit-message validation,
# secret scanning. Job names are referenced by branch-protection rules — do not
# rename OR DELETE one without coordinating the admin change in the same PR:
# GitHub waits forever on a required check whose job no longer exists, blocking
# every PR in the repo until an admin drops it from the required set (OPS-07).
#
# Every third-party action is pinned to a full commit SHA (P0-13, ADR-0003):
# mutable tags are a supply-chain channel. Dependabot's github-actions
# ecosystem keeps the pins fresh — a bump is a new SHA plus its version
# comment, never a floating tag.

name: CI

on:
  pull_request:
    branches: [main]
    # Default types + ready_for_review (OPS-04): the review-gate job passes
    # trivially on drafts, so the draft → ready transition must re-run CI —
    # without this type a draft's green check would survive into the ready PR
    # on the same SHA (stale-green bypass of the review gate).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Weekly re-audit (P0-07): advisories disclosed between PRs still surface,
  # since pinned versions never re-resolve on their own. The schedule re-runs
  # the whole workflow — deliberate: it doubles as a weekly green canary on
  # main, and the commitlint job already skips non-PR events.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turbo remote cache. TURBO_TOKEN / TURBO_TEAM are populated from repo secrets
# once an admin picks a provider (Open Decision D-1 in docs/IMPLEMENTATION.md).
# Until then they resolve to empty strings and Turbo silently skips remote
# cache — the local actions/cache@v4 entries below cover the warm-cache case.
env:
  # Concrete Node pin (P0-13): `node-version-file: package.json` resolved the
  # floating engines range (>=22.22.1) to the newest satisfying release, so CI
  # could silently jump majors. Bump this deliberately; keep it satisfying the
  # engines.node floor in package.json.
  NODE_VERSION: "22.23.1"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  # Speed: every job sets these once. The repo-local gitleaks binary is only
  # needed by the pre-commit hook on developer machines.
  ARGUS_SKIP_GITLEAKS_INSTALL: "1"
  HUSKY: "0"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier (check)
        run: pnpm format:check

      # Archived-handover link integrity (DOC-06). `docs/HANDOVER.md` is
      # authored at `docs/`, so its relative links break when rotation copies
      # it one level deeper into `docs/handovers/`. That went unnoticed for
      # months and reached 100 broken links, because nobody clicks links in an
      # archive. `pnpm handover:rotate` re-resolves them as it copies; this
      # step is what makes a hand-rolled `cp` fail loudly instead of silently,
      # which is the only reason the rot lasted. Zero-install — the script uses
      # node: builtins only — so it costs nothing to run here.
      #
      # Inline links only: reference-style definitions and raw HTML anchors are
      # invisible to it. See the script header.
      - name: Check archived handover links resolve (DOC-06)
        run: pnpm handover:check

      # Gate coverage (OPS-07). The root gates fan out — `turbo run typecheck`
      # to whichever packages declare the script, `pnpm test` to whichever are
      # listed in vitest's `projects` — and both report success when they reach
      # nothing. That is not hypothetical: `pnpm build` was a named sign-off
      # gate for the life of the project and ran zero tasks the entire time.
      # This step fails when a package is missing from a gate's fan-out, or
      # when one gains a `build` script the root gates no longer run.
      # Zero-install (node: builtins + `pnpm list`), so it costs nothing here.
      - name: Check root gates cover every workspace package (OPS-07)
        run: pnpm gates:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-

      - name: Typecheck (turbo)
        run: pnpm typecheck

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-

      # Aggregated run via root vitest.config.ts — one coverage report covering
      # every workspace project. `pnpm test:packages` (Turbo per-package) is
      # kept as a local-dev affordance but is not invoked here.
      - name: Vitest (aggregated coverage)
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # The `build` job runs `pnpm build`, which today executes ZERO tasks: no
  # workspace package declares a `build` script, and turbo reports
  # "0 successful, 0 total" as a success. It is therefore NOT a sign-off gate
  # and must never be cited as one — that false claim is exactly what OPS-07
  # found and removed from CLAUDE.md and the handovers. `typecheck` is the real
  # compile verification while the workspace stays buildless (D-5).
  #
  # It is kept, rather than deleted, because it stops being vacuous soon: D-8
  # is ruled "(a) bundle only", scheduled after Phase 2, and a bundle is a build
  # step. Deleting the job would mean re-adding it — and re-adding "Build" to
  # the branch-protection required set, which no agent can do — within weeks.
  # The `gates:check` step in `lint` fires the day a package declares `build`,
  # so the gate list gets updated instead of silently going stale again.

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-

      - name: Build (turbo)
        run: pnpm build

  # Stopgap public-advisory audit (P0-07). Catches the registry-indexed CVE
  # subset of supply-chain risk; explicitly NOT the comprehensive P11-02 audit
  # (typosquats, install-script/behavioural analysis, licensing) — replace or
  # fold into that when it ships, not before.
  #
  # Detection is NOT this job's job: Dependabot alerts are enabled and fire when
  # an advisory publishes, tagged runtime/development. This gate decides only
  # what BLOCKS a merge; the weekly cron above re-resolves pinned versions.
  # Scope split documented in docs/SECURITY-NOTES.md §"Audit Gate Scope".
  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --audit-level is the exit threshold on pnpm 11 (verified 2026-07-03,
      # re-verified 2026-07-25: high advisories → exit 1 at "high", exit 0 at
      # "critical"). Moderate-and-below always surface in the log without
      # blocking.
      #
      # Two gates, scoped by blast radius (2026-07-25 — rationale and the
      # residual risk accepted are recorded in docs/SECURITY-NOTES.md
      # §"Audit Gate Scope"). Shipped code and build tooling are not the same
      # risk: ~30 packages reach a user, ~540 only ever run here.
      - name: pnpm audit — shipped dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

      # The dev tree still blocks on critical: a critical in a build tool means
      # the CI runner itself can be taken over (it holds TURBO_TOKEN,
      # GITHUB_TOKEN, and later publish credentials). A *pure* DoS cannot reach
      # critical — with C:N/I:N the CVSS ceiling is 7.5 — so this stays immune
      # to the resource-exhaustion advisories that dominate dev-tree churn while
      # still stopping anything that can read or execute.
      - name: pnpm audit — full tree (fail on critical)
        run: pnpm audit --audit-level=critical

  # License-compliance gate (P0-12, ADR-0002 §G): SPDX allowlist over the full
  # third-party tree via scripts/check-licenses.mjs. Dev-tooling self-audit —
  # distinct from the planned P4-06 license-checker product adapter; P11-02's
  # comprehensive audit may later supersede it. Runs on the same trigger set as
  # audit (incl. the weekly cron — advisory-style license changes arrive with
  # version bumps, so re-checking pinned trees weekly is cheap insurance).
  # Not a branch-protection required check (same pending admin step, P0-03).
  license:
    name: License compliance (SPDX allowlist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses (ADR-0002 §G allowlist)
        run: pnpm license-check

      # Generated-file freshness (OPS-06). ADR-0002 §F requires
      # THIRD-PARTY-NOTICES to stay current with the tree, and CONTRIBUTING.md
      # asks contributors to regenerate it — until this step nothing checked,
      # so several tracker rows asserted "notices regenerated, zero diff"
      # against no mechanism at all.
      #
      # Not the usual `regenerate && git diff --exit-code`: the generated file
      # is only PARTLY reproducible across hosts. Packages declaring
      # `os`/`cpu`/`libc` resolve differently here (linux-x64) than on the
      # maintainer's machine (darwin-arm64), so a byte diff of the whole file
      # would fail 100% of the time. The generator writes those into a
      # trailing section and `--check` compares everything above it — the part
      # that IS a pure function of the dependency tree. It never writes, so a
      # failure here leaves nothing to clean up. See the script header.
      - name: Check THIRD-PARTY-NOTICES is in sync with the tree (ADR-0002 §F)
        run: pnpm notices:check

  commitlint:
    name: Commit message validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commit messages
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # Independent-review gate (OPS-04): makes the protocol's mandatory review
  # pass mechanical, now that status checks are required. Fails a PR unless it
  # carries evidence of the review — an "## Independent review packet" comment
  # (full tier) or an "## Independent review" block in the description (light
  # tier, docs/config-only diffs). Dumb by design: it checks for the marker,
  # not the review's quality — the required artifact is the forcing function
  # (the P1-02 review was skipped until the maintainer asked; prose gates fail
  # under momentum). No repo checkout, one API call. Not a branch-protection
  # required check until the maintainer adds it (admin step, same bucket as the
  # other jobs since P0-03).
  review-gate:
    name: Independent review pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    # issues:read alongside pull-requests:read (review finding): the comments
    # call below is the Issues API (PR conversation comments live there); the
    # fine-grained permission docs list the endpoint under both categories, so
    # grant both — if pull-requests:read alone were insufficient, every
    # full-tier PR would 403 and the fail-closed script would block it.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Require evidence of the independent review pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-author-controlled text — pass via env and read from env; never
          # interpolate ${{ github.event.* }} into the script body (Actions
          # script-injection hardening).
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # Canonical marker (protocol §Task Completion Checklist). Full-tier
          # packets post "## Independent review packet" as a PR comment;
          # light-tier diffs carry an "## Independent review" block in the
          # description. Both share the "## Independent review" heading stem,
          # at any heading level. Deliberately no trailing word boundary — it
          # must also match "...review packet"; the accepted tradeoff is that
          # an unrelated heading extending the stem (e.g. "## Independent
          # reviewer duties") would also pass. Dumb-and-fast beats clever here.
          marker='^#{1,6}[[:space:]]+Independent[[:space:]]+review'

          # Drafts are WIP — the review pass runs at completion.
          if [ "${PR_DRAFT}" = "true" ]; then
            echo "Draft PR — review pass deferred until ready. Passing."
            exit 0
          fi

          # Bot-authored dependency/release PRs (Dependabot, the changesets
          # Version PR) are maintainer-reviewed directly at merge and never go
          # through the agent review-packet flow — don't deadlock them. Quoted
          # case patterns match the literal "[bot]" login (no glob).
          case "${PR_AUTHOR}" in
            'dependabot[bot]' | 'github-actions[bot]' | 'dependabot-preview[bot]')
              echo "Bot author ${PR_AUTHOR} — review gate not applicable. Passing."
              exit 0
              ;;
          esac

          if printf '%s' "${PR_BODY:-}" | grep -qiE "${marker}"; then
            echo "Review summary found in the PR description. Passing."
            exit 0
          fi

          # One API call: the PR's conversation comments (review packets post
          # here). Fails closed if the call errors — set -e aborts the job on a
          # non-zero substitution, matching the pre-push gate's fail-closed
          # posture (OPS-03).
          comments="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body')"
          if printf '%s' "${comments}" | grep -qiE "${marker}"; then
            echo "Independent review packet comment found. Passing."
            exit 0
          fi

          echo "::error title=Independent review pass missing::No review evidence on this PR. Post an '## Independent review packet' comment (full tier) or add an '## Independent review' block to the description (light tier), then RE-RUN this job — comments and description edits do not re-trigger CI. See docs/plan/protocols/agentic-execution.md and docs/plan/protocols/quality-gates.md."
          exit 1

  # Per-task documentation delta (DOC-05). docs/plan/03-documentation.md has
  # required a delta from every task since DOC-01, but the obligation was prose
  # in a checklist and nothing checked it — the same shape of gap OPS-06 closed
  # for THIRD-PARTY-NOTICES, where tracker rows asserted a freshness claim
  # against no mechanism at all. This is that obligation made mechanical.
  # Modelled on review-gate above: no checkout, one job, fails closed. It
  # applies from its merge forward and never retro-judges already-merged work.
  #
  # THE TSDoc PROBLEM — resolved by CONTENT inspection (the DOC-05 spec required
  # an explicit ruling either way). Five of the six capture streams live outside
  # source, so a path match finds them. The sixth — TSDoc on public exports —
  # lives INSIDE packages/*/src/**, the very paths this gate treats as source. A
  # path-only gate cannot tell a TSDoc-only PR from one with no delta at all,
  # and would force a false "no docs delta" onto a change that is nothing but
  # documentation. A gate you must lie to in order to pass trains exactly the
  # reflex it exists to prevent, so this one reads the diff content for changed
  # doc-comment lines. Three accepted imprecisions, recorded rather than left
  # for the first false positive to discover:
  #   - `//` line comments deliberately do NOT count. Including them would pass
  #     nearly every diff and gut the gate.
  #   - only STARRED shapes count: `/**`, a ` * ` continuation, `*/`, or a bare
  #     `*`. A single-line `/* explanation */` does NOT match (its first two
  #     characters are `/*`, not `/**`), and an unstarred multi-line block
  #     matches only its closing line. Fails closed.
  #   - a markdown bullet inside a template literal (`+  * item`) can match.
  #     Fails open, narrowly, and only on a PR that touched source and no
  #     documentation file at all.
  docs-delta:
    name: Documentation delta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a documentation delta (or an explicit justification)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          # SOURCE_RE is read by both grep (POSIX ERE) and jq (gh bundles gojq,
          # an RE2-class engine) via $ENV, defined once so the two cannot drift.
          # Both engines agree on this pattern — keep it to that common subset;
          # gojq rejects Oniguruma-only syntax such as lookarounds.
          #
          # Source: the paths the per-task obligation is about. `.+` rather than
          # `[^/]+` between the workspace root and `src/` is deliberate and was
          # a review finding: packages nest. `packages/adapters/prettier/` is
          # already two segments deep, and Phase 4 grows that family — a
          # single-segment pattern silently skipped it, so a source-only PR to
          # the repo's only adapter package took the "no source paths touched"
          # branch and passed. Fail-open on 1 of 9 packages, in exactly the
          # place the continuation track expands.
          SOURCE_RE: "^(packages|apps)/.+/src/|^scripts/"
          # Documentation surface: the five capture streams that live outside
          # source. docs/** carries the guide, the recipes, the ADRs and the
          # architecture map; any README.md is the per-package "what / why /
          # surface" stream; a root-level *.md is the repo's own front matter
          # (README, CONTRIBUTING, SECURITY). The sixth stream, TSDoc, lives
          # inside source and is handled by content inspection below.
          DOCS_RE: "^docs/|(^|/)README\\.md$|^[^/]+\\.md$"
        run: |
          set -eu

          # Drafts are WIP — the delta is recorded at completion, exactly as
          # the review pass is.
          if [ "${PR_DRAFT}" = "true" ]; then
            echo "Draft PR — documentation delta deferred until ready. Passing."
            exit 0
          fi

          # Bot-authored dependency/release PRs never carry a task's doc delta
          # and are maintainer-reviewed at merge — don't deadlock them. Same
          # exemption list as review-gate; quoted patterns match the literal
          # "[bot]" login (no glob).
          case "${PR_AUTHOR}" in
            'dependabot[bot]' | 'github-actions[bot]' | 'dependabot-preview[bot]')
              echo "Bot author ${PR_AUTHOR} — docs-delta not applicable. Passing."
              exit 0
              ;;
          esac

          # One paginated call, filenames only. Fails closed: set -e aborts the
          # job if the API errors, matching review-gate and the pre-push gate.
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"

          if ! printf '%s\n' "${files}" | grep -qE "${SOURCE_RE}"; then
            echo "No source paths touched — docs-delta not applicable. Passing."
            exit 0
          fi

          if printf '%s\n' "${files}" | grep -qE "${DOCS_RE}"; then
            echo "Documentation surface touched. Passing."
            exit 0
          fi

          # TSDoc — the sixth stream, inside the source paths. See the header.
          patches="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.filename | test($ENV.SOURCE_RE)) | .patch // "###ARGUS_PATCH_UNAVAILABLE###"')"

          # Grep the patches we DID get before worrying about any we did not.
          # Review finding: with the sentinel checked first, a single
          # patch-less file suppressed the doc-comment check for the whole PR
          # — so a change carrying a real, visible TSDoc delta would be told to
          # assert "no docs delta", which is the very lie this gate refuses to
          # make people tell. The sentinel line starts with `#` and cannot match
          # the doc-comment pattern, so checking content first is safe.
          if printf '%s\n' "${patches}" | grep -qE '^[+-][[:space:]]*(/\*\*|\*/|\*[[:space:]]|\*$)'; then
            echo "Changed doc-comment (TSDoc) lines in source. Passing."
            exit 0
          elif printf '%s\n' "${patches}" | grep -q '###ARGUS_PATCH_UNAVAILABLE###'; then
            # GitHub omits .patch for very large diffs, and also for binaries,
            # pure renames and mode-only changes. Nothing we could see carried a
            # doc comment and something was invisible, so we cannot claim a
            # TSDoc delta — fall through to the justification check rather than
            # guess. Fails closed.
            echo "::warning title=Patch unavailable::GitHub omitted the patch for at least one source file (too large, or a binary/rename/mode-only change), so the TSDoc content check could not run on it, and no other changed source file carried a doc comment. An explicit justification line is required."
          fi

          # The escape hatch. Fetched LIVE rather than read from
          # github.event.pull_request.body: the event payload freezes the
          # description at trigger time, so a re-run after editing the body
          # would replay the stale text and fail again. (review-gate reads the
          # frozen payload and has that trap for its light tier — its "RE-RUN
          # this job" advice only really works for the comment path.) Author-
          # controlled text: read into a variable and grep it, never eval it.
          body="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"

          # Anchored to a line start, tolerant of markdown decoration around
          # it, and a reason is mandatory — "no docs delta" with nothing after
          # the dash is the vacuous answer this gate exists to refuse. The
          # phrase is deliberately NOT pre-printed in PR.template.md, for the
          # same reason the review heading is not: an unedited template must
          # fail, never pass vacuously.
          hatch='^[[:space:]]*[-*>_[:space:]]*no docs delta[*_[:space:]]*(—|–|-|:)[[:space:]]*[^[:space:]]'
          # …and the un-edited placeholder is not a reason. The failure message
          # below prints the literal line to add, `<one-line reason>` and all;
          # pasted verbatim it satisfied `hatch`, because `<` is a non-space
          # character. That is the same vacuous pass the template is written to
          # avoid, arriving via the error message instead. Review finding.
          placeholder='^[[:space:]]*[-*>_[:space:]]*no docs delta[*_[:space:]]*(—|–|-|:)[[:space:]]*<'

          # Per line, not per body: a description may legitimately quote the
          # placeholder (this workflow's own error text, say) alongside a real
          # justification. Keep the lines that satisfy `hatch`, then require at
          # least one of them to be something other than the placeholder.
          if printf '%s' "${body}" | grep -iE "${hatch}" | grep -qivE "${placeholder}"; then
            echo "Explicit 'no docs delta' justification found in the PR description. Passing."
            exit 0
          fi

          echo "::error title=Documentation delta missing::This PR changes source (packages/*/src, apps/*/src or scripts/) but touches no documentation surface and changed no doc comments. Either record the delta — a docs/ page, a README.md, or TSDoc on the exports you changed — or add a line reading 'no docs delta — <one-line reason>' to the PR description, then RE-RUN this job (a description edit does not re-trigger CI). Standard: docs/plan/03-documentation.md."
          exit 1

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action calls GET /repos/{owner}/{repo}/pulls/{n}/commits to
    # enumerate the PR's commits, which the default contents:read scope does
    # not grant. Add pull-requests:read here so the rest of the workflow
    # stays on least-privilege.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan every commit in a PR (and the
          # full repo history on push-to-main).
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by gitleaks-action v2+ to fetch the PR diff via the
          # GitHub API. The default GITHUB_TOKEN has read-only contents
          # scope, which is all the action needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use repo-committed config (.gitleaks.toml) including the fixture
          # allowlist. The action picks it up automatically.
          GITLEAKS_CONFIG: .gitleaks.toml

  # Architecture boundary enforcement (OPS-04, argus-oss#15 item 2): the
  # dependency-cruiser rules in .dependency-cruiser.cjs make the package
  # contracts mechanical — core/src imports nothing but neverthrow (no Node
  # builtins), cross-package imports land only on public entry points, the
  # testing→core edge stays one-way and type-only in src. Convention-and-
  # review enforcement becomes CI; Phase-2 dogfooding will reinforce, not
  # replace, this job. Not a branch-protection required check until the
  # maintainer adds it (same admin bucket as the other jobs, P0-03).
  boundaries:
    name: Architecture boundaries (dependency-cruiser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries (dependency-cruiser)
        run: pnpm boundaries

  # Dogfooding (Phase 2 exit criterion): CI of Argus runs Argus on Argus.
  # Repo-root argus.yaml ignores test files/fixtures (maintainer ruling
  # 2026-07-25) — everything else is real source, held to the same bar every
  # user's project is. No `pnpm build`: the workspace is buildless (P2-02),
  # so `bin/argus.mjs` runs straight from a fresh install.
  #
  # The JSON document is redirected to a file, never piped. A pipe's exit
  # code is the last command in the pipeline, not argus's — the exact
  # anti-pattern the P2-04 review caught in the guide's own flagship jq
  # recipe (a scan where every file failed to analyse still read as
  # success). This job trusts argus's own exit code instead: GitHub Actions
  # runs `run:` steps under `set -e`, so 0 passes, 1 (violations) or 2 (scan
  # never started) fails the step — no jq, no `$?` bookkeeping (jq is used
  # once below, only to sanity-check the document isn't from a vacuous scan,
  # and its own exit code is what's checked). Not yet a branch-protection
  # required check until the maintainer adds it (same admin bucket as
  # `boundaries`/`license`/`review-gate`, P0-03) — until then this gate
  # reports but does not block.
  dogfood:
    name: Dogfood (argus check argus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: argus check . --format json
        run: node apps/cli/bin/argus.mjs check . --format json > argus-report.json

      # A path that matches nothing is a *successful* zero-file scan (P2-04
      # decision, so `--format json` never hands a consumer an empty stream
      # from a scan that never ran) — so exit 0 alone cannot distinguish "135
      # clean files" from "argus.yaml's ignore list ate everything". Floored
      # well under the repo's current ~135 tracked, scannable files so it has
      # room to shrink but still catches a vacuous scan (review finding).
      - name: Assert the scan was not vacuous
        run: jq -e '.summary.filesScanned > 100' argus-report.json > /dev/null

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # run_attempt alongside run_id: v4 rejects a duplicate artifact name
          # within a run, which a re-run of just this job would otherwise hit
          # (pre-existing pattern in the `test` job's `coverage-` artifact
          # above, not fixed here — out of scope for this task).
          name: argus-self-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus-report.json
          if-no-files-found: warn
          retention-days: 14
