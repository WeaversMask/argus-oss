packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"

# ── Supply-chain hardening (ADR-0003) ──────────────────────────────────────
# Newly published versions must be ≥3 days old before pnpm resolves them —
# malicious releases are typically detected and yanked within hours/days.
# Urgent security patch that can't wait: add the package name to
# minimumReleaseAgeExclude, install, then remove the entry again.
# Procedure: docs/SECURITY-NOTES.md §"Supply-Chain Controls (pnpm)".
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []

# No dependency may run install/build scripts. pnpm 11 blocks unlisted
# packages by default; the map makes the reviewed posture explicit.
# `pkg: true` = reviewed, script may run — only after reviewing what the
# script does. `pkg: false` = reviewed and DENIED: the script stays blocked
# and pnpm stops failing install (ERR_PNPM_IGNORED_BUILDS) over it. pnpm
# itself scaffolds placeholder entries here when it hits unreviewed builds.
#
# tree-sitter grammars (P1-03, ADR-0005): `install: node-gyp-build` would
# compile the NATIVE binding, which @argus/ast never loads — it consumes
# only the prebuilt .wasm shipped in the same tarballs. Keys cover every
# lockfile version (tree-sitter-javascript appears as 0.25.0 direct and
# 0.23.1 via tree-sitter-typescript).
allowBuilds:
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false

# ── Security pins for vulnerable transitives (Dependabot, 2026-07-03) ──────
# pnpm update cannot reach these (not direct deps of any workspace project),
# so vulnerable resolutions are rewritten via scoped overrides instead.
# Remove each pin once the dependents' locked versions resolve past it.
# NOTE: this block was headed "dev-only transitives" until 2026-08-09. That was
# never true of js-yaml, which reaches the SHIPPED tree via @argus/config —
# see its entry below. Check `pnpm why <pkg> --prod` before assuming dev-only.
# vite:    GHSA-fx2h-pf6j-xcff (high, server.fs.deny bypass on Windows) and
#          GHSA-v6wh-96g9-6wx3 (moderate, launch-editor NTLMv2 hash leak);
#          via vitest/@vitest/mocker (range allows ^8).
# js-yaml: GHSA-h67p-54hq-rp68 (moderate, quadratic merge-key DoS, <4.2.0),
#          GHSA-52cp-r559-cp3m (moderate, <4.3.0), then GHSA-5p4m-2wfm-xmqj /
#          CVE-2026-59870 (HIGH, quadratic CPU consumption resolving !!omap,
#          <4.3.1). Each of the three widened the affected range past the
#          standing pin — 4.2.0 → 4.3.0 → 4.3.1 — so treat this pin as one that
#          moves, not one that is done.
#          **NOT dev-only, unlike every other entry here.** js-yaml is in the
#          SHIPPED tree via @argus/config ← cosmiconfig, so this advisory trips
#          `pnpm audit --prod --audit-level=high` — the blocking first step of
#          the audit job — and blocked main and every open PR from 2026-08-09
#          with no dependency change on our side. (It also arrives dev-side via
#          @commitlint/load and @changesets/*; that is the path the original
#          comment recorded, and recording only that is what made this look
#          like a cleanliness pin rather than a release blocker.)
#          The 3.x line is pinned too, and READ THE ADVISORY'S STRUCTURED DATA
#          RATHER THAN ITS PROSE — that is the transferable part. This advisory
#          carries TWO vulnerability nodes: >=3.0.0 <3.15.1 (patched 3.15.1) and
#          >=4.0.0 <4.3.1 (patched 4.3.1); upstream shipped both on 2026-07-31,
#          nine minutes apart, and 3.15.1 is the current `v3-legacy` dist-tag.
#          The advisory's PROSE says the fix "was never backported", which is
#          about the 5.x line and reads as though 3.x were unfixable — the first
#          draft of this comment believed it and recorded 3.15.0 as a permanent
#          exception. It is not: read-yaml-file@1.1.0 declares js-yaml ^3.6.1,
#          which 3.15.1 already satisfies, and the two releases have identical
#          dependency sets, so this is a patch bump with no API surface change.
#          js-yaml@3.15.0 reaches only the dev tree (read-yaml-file ←
#          @manypkg/get-packages ← @changesets/*), so it never blocked a merge —
#          which is exactly why the false claim would have survived unchallenged.
# fast-uri: GHSA-v2hh-gcrm-f6hx (HIGH, host confusion via literal backslash
#          authority delimiter, <=3.1.3); via ajv ← @commitlint/* and
#          @stryker-mutator/core. **Stepped over 2026-08-10:**
#          GHSA-7p8r-x3mc-p8w7 (HIGH) supersedes it with three nodes —
#          <2.4.4, >=3.0.0 <3.1.5, >=4.0.0 <4.1.2 — so the 3.1.4 pin written for
#          the advisory above no longer cleared it. Now 3.1.5. Only the 3.x node
#          is pinned: 2.x and 4.x are absent from this tree. Known and accepted;
#          if either line ever appears, it needs its own entry.
# brace-expansion: GHSA-3jxr-9vmj-r5cp (HIGH, ReDoS via exponential expansion),
#          two affected ranges (<1.1.16 and >=2.0.0 <2.1.2) both reached through
#          the old license-checker ← glob ← minimatch chain. **Stepped over
#          2026-08-10, on every line at once, by TWO advisories — not one:**
#            GHSA-mh99-v99m-4gvg  <1.1.17 · >=2.0.0 <2.1.3 · >=3.0.0 <3.0.3 · >=4.0.0 <5.0.8
#            GHSA-rgw5-rvv9-x895  <1.1.18 · >=2.0.0 <2.1.4 · >=3.0.0 <3.0.6 · >=4.0.0 <5.0.9
#          Four release lines, each pinned to the WIDER of the two bounds:
#          1.1.18, 2.1.4, 3.0.6, 5.0.9. **3.x is pinned pre-emptively** — no 3.x
#          resolves here today, but this package already spans three lines in this
#          tree and both advisories name 3.x, so the entry is cheaper than the
#          next surprise (same reasoning as the js-yaml 3.x entry above).
#          Two distinct chains, and they are not interchangeable: the 2.x line
#          comes via minimatch@9 ← glob ← rimraf, the 5.x line via minimatch@10 ←
#          eslint / typescript-eslint / @stryker-mutator/core. The 5.x *resolution*
#          is not new — it has been in the lockfile since 2026-07-04; only the
#          override entry is.
#          **How this nearly shipped wrong, and it is the reason this block exists:**
#          the first triage keyed `pnpm audit --json` records by module name, so
#          records silently overwrote each other and exactly ONE range was seen.
#          The 2.x pin went in asserting "the 2.x range is NOT named by the new
#          advisory" — false — and surfaced only because fixing 1.x exposed the
#          range behind it. The review then found the *same* collapse a second
#          time in the correction itself: two GHSAs merged into one, dropping the
#          3.x node. **Never collapse advisory records by package, and never trust
#          a per-package view to be complete** — one package here carries eight
#          nodes across two advisories.
# qs:      GHSA-q8mj-m7cp-5q26 (moderate, remotely triggerable DoS in
#          qs.stringify, <6.15.2); via @stryker-mutator/core ← typed-rest-client.
# postcss: HIGH — path traversal via previous-source-map auto-loading
#          (sourceMappingURL) leading to arbitrary .map file disclosure,
#          <=8.5.17. Reached only through vite ← @vitest/mocker ← vitest, i.e.
#          the dev/test toolchain; Argus ships no CSS pipeline and never runs
#          postcss on untrusted input. Advisory published after the P2-01
#          merge, so it began failing the audit gate on main and on every open
#          PR without any dependency change on our side. **Stepped over
#          2026-08-10:** GHSA-fxqj-rqcc-2cmp is explicitly an *incomplete fix* of
#          the above — same attack, range extended to <=8.5.22. Pin 8.5.18 →
#          8.5.23. A pin written against advisory N does not survive advisory N+1
#          on the same defect. Note the successor is **moderate**, not HIGH like
#          its predecessor: it is the single moderate in the 2026-08-10 batch.
# nanoid:  TWO advisories, both HIGH, both published 2026-07-29 (noticed here
#          2026-08-10) — GHSA-2v37-7h3g-55p8 (custom generators loop indefinitely
#          on size zero, <3.3.17) and GHSA-28wg-ghj8-5hjv (non-secure generators,
#          negative size, <3.3.16). The ranges nest, so the single 3.3.17 pin
#          clears both; both also carry 4.x/5.x nodes that are absent from this
#          tree. Reached only through postcss ← vite ← vitest, so it arrived with
#          the postcss chain above and is dev-only; `pnpm why nanoid --prod`
#          returns nothing. Dependabot also opened argus-oss#53 for it; this
#          override fixes it at the tree level, which that PR alone would not
#          (pnpm cannot reach a deep transitive).
# **js-yaml is the ONLY pin here on a shipped path**, and therefore the only one
# that can trip the blocking `pnpm audit --prod --audit-level=high` gate —
# `pnpm why <pkg> --prod` returns nothing for every other package in this list.
# fast-uri, brace-expansion and postcss were HIGH under the full-tree
# `--audit-level=high` gate that SECURITY-NOTES.md §6 retired on 2026-07-25;
# with the full tree now gated at `critical` only, they and the moderates (qs,
# vite) are discretionary hygiene — kept for a clean audit, not load-bearing.
# Do not read this list as "four pins keep merges unblocked": it is one.
overrides:
  "vite@>=8.0.0 <8.0.16": 8.0.16
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "js-yaml@>=3.0.0 <3.15.1": 3.15.1
  "fast-uri@>=3.0.0 <3.1.5": 3.1.5
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=3.0.0 <3.0.6": 3.0.6
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "qs@>=6.11.1 <6.15.2": 6.15.2
  "postcss@<8.5.23": 8.5.23
  "nanoid@<3.3.17": 3.3.17
